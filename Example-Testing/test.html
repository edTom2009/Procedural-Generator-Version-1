<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="test-style.css">
    <title>Main Dashboard</title>
</head>
<body>

<div class="main">
    <h1>Procedural Terrain Generator</h1>
    <div class="navigation">
        <button id="btnSettings">Settings</button>
        <button id="btnHelp">Help</button>
        <button id="btnLogOut">Log Out</button>
    </div>

</div>
   
<div class="parameterInput">

    <h2>Parameter Input</h2>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Officia eaque dolore beatae animi? Iste, eaque harum corporis dignissimos saepe enim deleniti dolor voluptatum est natus. Numquam, ad sed. Exercitationem, deserunt?</p>

    <form action="\Python\main.py" method="get" class="formParameter">
        <label for="mapWidth">Map Width:</label>
        <input type="number" id="mapWidth" name="mapWidth">
        <br><br>

        <label for="mapHeight">Map Height:</label>
        <input type="number" id="mapHeight" name="mapHeight">
        <br><br>

        <label for="seedVal">Seed Value:</label>
        <input type="number" id="seedVal" name="seed">
        <br><br>

        <div class="slideContianer">
            <label for="sldrDetail">Detail</label><br>
            <span>Low</span>
            <input 
                type="range" 
                min="1" 
                max="100" 
                value="50" 
                class="slider" 
                id="sldrDetail">
            <span>High</span>
            <br><br>
        </div>

        <div class="parameterButtons">
            <input type="submit" id="generateTerrain" value="Generate Terrain">
            <button id="exportTerrain">Export Terrain</button>
        </div>
    </form>

</div>

</body>
</html>
