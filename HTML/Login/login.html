<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Log In</title>
</head>
<body>
    <div class="login-container">
        <h1>Log In</h1>
        <form action="/HTML/Dashboard/index.html" method="post">
            <input 
                type="text" 
                id="username" 
                name="username"
                value="Username" 
                required>
            <br><br>
            <input 
                type="text" 
                id="password" 
                name="password" 
                value="Password"
                required>
            <br><br>
            <input type="submit" value="Log In">
        </form>
        <a href="/HTML/Account_Creation/createAcc.html">Create Account</a>
    </div>
    <script src="login.js"></script>
</body>
</html>
