<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Create Account</title>
</head>
<body>
    <div class="background">
        <img id="createAccImage" src="createAccPlaceholder.jpg">
    </div>

    <div class="content-container">
        <div class="inner-content">
            <h1>Create Account</h1>
            <p>Enter your details to create an account.</p>

            <form action="/HTML/Account/login.html" method="post">
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    value="Username"
                    required>
                <br><br>

                <input 
                    type="text" 
                    id="password" 
                    name="password" 
                    value="Password"
                    required>
                <br><br>
                <input type="submit" value="Create Account">
            </form>
            <a href="/HTML/Account/login.html">Back to Login</a>
        </div>
    </div>
    <script src="createAcc.js"></script>
</body>
</html>
