<!DOCTYPE html>
<html>
   <head>
      <title>Index Page</title>
   </head>
   <body>
      <h3>Profiles</h3>

      <a href="/register">ADD</a>
      <br><br>

      <table border="1">
         <thead>
            <tr>
               <th>Id</th>
               <th>Username</th>
               <th>Password</th>
               <th>Action</th>
            </tr>
         </thead>

         <tbody>
            {% for data in users %}
            <tr>
               <td>{{ data.id }}</td>
               <td>{{ data.username }}</td>
               <td>{{ data.password }}</td>
               <td>
                  <a href="/delete/{{ data.id }}">Delete</a>
               </td>
            </tr>
            {% endfor %}
         </tbody>

      </table>
   </body>
</html>
