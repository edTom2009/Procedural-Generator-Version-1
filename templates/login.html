<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{url_for('static', filename='login.css')}}">>
    <title>Welcome Back</title>
</head>
<body>
    <div class="background">
        <img id="createAccImage" src="{{url_for('static', filename='createAccPlaceholder.jpg')}}">
    </div>

    <div class="content-container">
        <div class="inner-content">
            <h1>Welcome back...</h1>
            <p>Enter your details to sign in.</p>

            <form action="{{url_for('login')}}" method="post">
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    value="Username"
                    required>
                <br><br>

                <input 
                    type="text" 
                    id="password" 
                    name="password" 
                    value="Password"
                    required>
                <br><br>
                <input type="submit" value="Sign In">
            </form>
            <p>Not got an account?</p>
            <a href="{{url_for('create_account')}}">Create Account</a>
        </div>
    </div>
    <script src="{{url_for('static', filename='createAcc.js')}} "></script>
</body>
</html>
